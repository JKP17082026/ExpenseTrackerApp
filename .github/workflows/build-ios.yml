name: Build iOS App

# วิธีใช้: push โค้ดขึ้น GitHub repo แล้วเข้าแท็บ "Actions" เพื่อดูสถานะ build
# เมื่อ build เสร็จ ไฟล์ .ipa จะอยู่ใน "Artifacts" ท้าย log ให้กดโหลดได้เลย
# รันบนเครื่อง macOS ของ GitHub ฟรี (มี free tier ให้ใช้ต่อเดือน) ไม่ต้องมี Mac เอง

on:
  push:
    branches: [ main ]
  workflow_dispatch: {} # กดรันเองได้จากหน้า Actions โดยไม่ต้อง push

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      # สำคัญ: ต้องระบุ -f net10.0-ios ตอน restore ด้วย
      # ไม่งั้น dotnet จะพยายาม restore ทุก TargetFramework ในโปรเจกต์ (รวม net10.0-windows...)
      # ซึ่ง macOS build ไม่รองรับ target windows แล้วจะ error:
      # "To build a project targeting Windows on this operating system, set the EnableWindowsTargeting property to true."
      - name: Restore dependencies (iOS only)
        run: dotnet restore ExpenseTrackerApp/ExpenseTrackerApp.csproj -p:TargetFramework=net10.0-ios

      # Build แบบไม่ sign (unsigned) — ใช้ตรวจสอบว่าคอมไพล์ผ่านหรือไม่ และรันบน Simulator ได้
      # การ build ที่ sign แล้วสำหรับติดตั้งเครื่องจริง ต้องเพิ่ม step เซ็น certificate/provisioning profile
      # (ต้องมี Apple Developer Account ก่อน ดูหมายเหตุด้านล่าง)
      - name: Build for iOS Simulator (unsigned)
        run: |
          dotnet build ExpenseTrackerApp/ExpenseTrackerApp.csproj \
            -p:TargetFramework=net10.0-ios \
            -c Debug \
            --no-restore \
            -p:RuntimeIdentifier=iossimulator-x64 \
            -p:CodesignKey="" \
            -p:CodesignProvision=""

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: ExpenseTrackerApp/ExpenseTrackerApp/bin/Debug/net10.0-ios/iossimulator-x64/*.app

