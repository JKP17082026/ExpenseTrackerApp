name: Build iOS App

# วิธีใช้: push โค้ดขึ้น GitHub repo แล้วเข้าแท็บ "Actions" เพื่อดูสถานะ build
# เมื่อ build เสร็จ ไฟล์ .ipa จะอยู่ใน "Artifacts" ท้าย log ให้กดโหลดได้เลย
# รันบนเครื่อง macOS ของ GitHub ฟรี (มี free tier ให้ใช้ต่อเดือน) ไม่ต้องมี Mac เอง

on:
  push:
    branches: [ main ]
  workflow_dispatch: {} # กดรันเองได้จากหน้า Actions โดยไม่ต้อง push

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      # สำคัญ: ต้องระบุ -f net10.0-ios ตอน restore ด้วย
      # ไม่งั้น dotnet จะพยายาม restore ทุก TargetFramework ในโปรเจกต์ (รวม net10.0-windows...)
      # ซึ่ง macOS build ไม่รองรับ target windows แล้วจะ error:
      # "To build a project targeting Windows on this operating system, set the EnableWindowsTargeting property to true."
      - name: Restore dependencies (iOS device only)
        run: dotnet restore ExpenseTrackerApp/ExpenseTrackerApp.csproj -p:TargetFramework=net10.0-ios -p:RuntimeIdentifier=ios-arm64 -p:Configuration=Release

      # Build แบบ Release (ad-hoc signed) สำหรับ "เครื่อง iPhone จริง" (arm64)
      # ใช้ Release แทน Debug เพราะ Debug ใช้ Mono Interpreter ที่โหลดช้ามากบนอุปกรณ์จริง
      # ทำให้ iOS watchdog (0x8BADF00D) ฆ่าแอปทิ้งตอนเปิดเพราะใช้เวลาเกินที่กำหนด (~15-20 วิ)
      # Release จะ compile แบบ Full AOT ทำให้เปิดเร็วกว่ามาก
      - name: Build for iOS Device (ad-hoc signed, Release)
        run: |
          dotnet build ExpenseTrackerApp/ExpenseTrackerApp.csproj \
            -p:TargetFramework=net10.0-ios \
            -c Release \
            --no-restore \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:PlatformTarget=ARM64 \
            -p:BuildIpa=true \
            -p:CodesignKey="-" \
            -p:CodesignProvision=""

      - name: List build output (for debugging path)
        run: find . \( -name "*.app" -o -name "*.ipa" \) -type d -o -name "*.ipa" -type f

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-build-release
          path: |
            **/bin/**/*.app
            **/bin/**/*.ipa
          if-no-files-found: warn

